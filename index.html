<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <script src ='https://cdn.tailwindcss.com'></script>
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body class="bg-indigo-100 flex flex-col items-center justify-center h-screen" >
  <div class="bg-neutral-50 max-w-full w-80 mx-10 mt-5 h-min rounded-xl">
    <div class="m-5 mb-4">
        <div class="rounded-xl overflow-hidden">
          <img src="./images/image-qr-code.png">
        </div>
      <div class="flex flex-col mx-2 mt-4 mb-10 gap-4">
        <h1 class="font-bold text-center text-slate-700 text-lg w-full">Improve your front-end skills by building projects</h1>
        <p class="text-center text-sm text-slate-400 font-medium">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
        </div>
    </div>
  </div>
  <footer class="attribution mt-1">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Abraham Rivera</a>.
  </footer>
</body>
</html>
